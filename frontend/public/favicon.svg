<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Solid navy rounded-square background -->
  <rect width="64" height="64" rx="14" fill="#1D3557" />

  <!-- WP Monogram: zigzag W + vertical P stem in cream, solid amber circle as P's loop -->
  <!-- W: 5 points (down-up-down-up) -->
  <path
    d="M 9.5 21 L 16.5 43 L 23.5 25 L 30.5 43 L 37.5 21"
    fill="none"
    stroke="#F2EFE8"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- P: vertical stem -->
  <path
    d="M 44.5 21 L 44.5 43"
    fill="none"
    stroke="#F2EFE8"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- P: solid amber circle loop -->
  <circle cx="51" cy="27" r="6" fill="#E8A33D" />
</svg>